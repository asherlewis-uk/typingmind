version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
      - "127.0.0.1:8444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src:/var/www/typingmind/src:ro
      - ./config:/var/www/typingmind/config:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - typingmind

  api:
    build: ./api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=typingmind
      - OLLAMA_HOST=http://ollama:11434
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=typingmind
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=typingmind
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=typingmind
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=typingmind
    depends_on:
      - mysql
      - postgres
      - minio
    networks:
      - typingmind

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: typingmind
      MYSQL_USER: typingmind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - typingmind

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: typingmind
      POSTGRES_USER: typingmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - typingmind

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - typingmind

networks:
  typingmind:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
  postgres_data:
  minio_data:
