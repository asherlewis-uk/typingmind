version: "3.8"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8082:80"
      - "127.0.0.1:8444:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/asher/typingmind/src:/var/www/nexumchat/src:ro
      - /home/asher/typingmind/config:/var/www/nexumchat/config:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nexumchat

  api:
    build: ./api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=nexumchat
      - EMBEDDING_HOST=http://ollama:11434
      - EMBEDDING_MODEL=nomic-embed-text
      - TTS_HOST=http://voice:8000
      - TTS_VOICE=piper-lessac
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=nexumchat
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nexumchat
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=nexumchat
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=nexumchat
    depends_on:
      - mysql
      - postgres
      - minio
    networks:
      - nexumchat

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nexumchat
      MYSQL_USER: nexumchat
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - nexumchat

  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: nexumchat
      POSTGRES_USER: nexumchat
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - nexumchat

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - nexumchat

  voice:
    build: ./voice
    restart: unless-stopped
    volumes:
      - /home/asher/hermes-voice/models:/app/models:ro
    environment:
      - CUDA_VISIBLE_DEVICES=
    networks:
      - nexumchat

networks:
  nexumchat:
    # external: true
    # name: typingmind-selfhosted_typingmind

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
    # external: true
    # name: typingmind-selfhosted_mysql_data
  postgres_data:
    # external: true
    # name: typingmind-selfhosted_postgres_data
  minio_data:
    # external: true
    # name: typingmind-selfhosted_minio_data
